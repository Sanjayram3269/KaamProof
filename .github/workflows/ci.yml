name: Product quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_USER: kaamproof
          POSTGRES_DB: kaamproof_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaamproof -d kaamproof_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kaamproof:ci-test-password@localhost:5432/kaamproof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt pip-audit
      - run: ruff check app tests migrations
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
      - run: pip-audit -r apps/api/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm audit
        working-directory: apps/web
  containers-and-browser:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-container-password
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: docker compose build && docker compose up -d --wait
      - run: curl --fail http://localhost:8080/api/v1/health
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: apps/web/test-results
      - if: always()
        run: docker compose down
