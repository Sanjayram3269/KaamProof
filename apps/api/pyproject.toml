[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaamproof-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","sqlalchemy>=2,<3","psycopg[binary]>=3.2,<4","pydantic-settings>=2.5,<3","email-validator>=2.2,<3","python-multipart>=0.0.12","passlib[bcrypt]>=1.7.4","bcrypt<4.1","python-jose[cryptography]>=3.3","alembic>=1.13,<2","reportlab>=4.2,<5","Pillow>=10.4"]
[project.optional-dependencies]
dev = ["pytest>=8","httpx>=0.27","ruff>=0.6"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
